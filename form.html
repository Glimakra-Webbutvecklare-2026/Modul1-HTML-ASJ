    <h1>Om formulär</h1>

    <!-- elementet form används för att skapa ett formulär -->

    <!-- ex 1 - ett fält för att skriva namn -->

    <!-- metoden 'get' innebär att en url ger resultatet av ex en knapptryckning -->
    <form action="" method="get">

        <!-- ett fält för att skriva text 
        elementet input med attributet type="text" 
        se till att attributen name och id finns angivna
        attributet name: anger namn på ett visst element, exempelvis 'name', 'first_name'
        attributet placeholder ger möjlighet att hinta i grå text vad som ska skrivas
        -->
        <input type="text" name="fullname" id="" placeholder="Ditt namn">

        <!--
        för att skicka, spara, använda ... lägg till en knapp
        ett formulär som skickas har ett 'submit event' vilket förvalt sker genom
        att klicka på en knapp av typ submit
        -->
        <input type="submit" value="Skicka">

    </form>


    <br><br><br><br><br>

    <!-- ex 2 - ett fält för att skriva e-post -->

    <form action="" method="get">

        <!-- elementet label används för att skriva en förklaring till 
        det fält som finns 
        attributet for ska matcha värdet hos ett element med motsvarande id
        Stängsningstag för label elementet kan oxå placeras efter tillhörande fält
        -->

        <label for="email">
            Email adress:

            <!-- använd br elementet för att placera text ovanför input fältet -->
            <br>

            <!-- input type="email" 4
            gör fältet obligatoriskt med attributet 'required' 
            -->
            <input type="text" name="email" id="email" required>
        </label>

        <!-- en knapp kan oxå skapas med elementet button 
        istället för submit som ovan 
        här kan attributet type="submit" anges eller utelämnas
        -->
        <button type="submit">Jag vill ha nyhetsbrev</button>

        <!-- med type="reset" nollas samtliga fält i omslutande form element -->
        <button type="reset">Börja om</button>

    </form>



    <br><br><br><br><br>

    <!-- ex 3 - ett formulär med method get || post 
     
    OBS! Med Live Server genereras ett HTTP 405 meddelande om man 
    användet metoden POST
    -->

    <!-- i modul 1 finns inte mkt att göra då det gäller design
    se elementet <br> i koden nedan - 'funkar' bara i modul 1  
    -->

    <form action="" method="get">

        <!-- signa upp med namn, mail och lösenord -->
        <label>För- och efternamn: <br><input type="text" name="fullname"></label>
        <br><br>
        <label>E-post: <br><input type="email" name="email"></label>
        <br><br>
        <label>Lösenord: <br><input type="password" name="password"></label>
        <br>
        <button>Registrera</button>

    </form>


    <br><br><br><br><br>

    <!-- uppgift
     
    skapa ett nytt formulär
    det ska innehålla minst 2 varianter av input som vi inte kodat
    koda fram till 13:20

    var nyfiken - kolla vad för olika typer som finns. 
    kan det finnas en mening med att ex använda input:image
    -->

    <!-- ex 4 input radio och checkbox -->

    <form action="" method="get">


        <h4>Trafikvett / ovett?</h4>

        <p>
            När ska man <strong>stanna</strong> vid ett trafikljus?
        </p>

        <!-- till input type radio och checkbox använd attributet value 
        input:radio
        
        för dessa fält kan eventuellt elementet fieldset pass
        -->

        <fieldset>
            <!-- vad heter elementet som kan skapa en slags rubrik i ett fieldset -->
            <legend> färg? </legend>
            <label><input type="radio" name="color_signal" value="green"> grön</label>
            <label><input type="radio" name="color_signal" value="yellow"> gul</label>
            <label><input type="radio" name="color_signal" value="red"> röd</label>
        </fieldset>

        <!--
        input:checkbox
        -->

        <p>
            När ska man <em>köra</em> vid ett trafikljus?
        </p>

        <fieldset>
            <legend>kanske...</legend>
            <label><input type="checkbox" name="clear_path">När ingen är i vägen</label>
            <label><input type="checkbox" name="clear_mindset">När det är läge</label>
            <label><input type="checkbox" name="perhaps_now">När tålamodet tryter</label>
        </fieldset>


        <!-- visa ett fritext fält som man kan skriva i 
        använd attributen cols och rows för att förändra storlek
        -->

        <br><br>

        <label for="background">Berätta lite om vem du är</label>
        <br>
        <textarea name="background" id="background" cols="40" rows="7"></textarea>
        <br><br>

        <button>Kontrollera mina svar</button>

    </form>



    <br><br><br><br><br>

    <!-- ex 5 - en select option lista -->

    <form action="" method="get">


        <!-- förvalt är följande element hanterade som inline element
        dvs, elementen placerad brediv varandra
        
        Om elementet ska placeras radvis så kan man göra det ex med elementet br
        -->

        <div>
            <label for="website">Välj en webbplats i listan</label>
        </div>
        <div>

            <!-- en select option lista innebär ofta ett val bland flera  
            
            med attributet multiple kan flera val vara möjliga
            attributet size anger oxå hr mkt som visas
            -->
            <select name="website" id="website" multiple size="9">

                <!-- uppgift
                Skapa olika val i listan som har en url. 
                Url:er anges som value, 
                medans en enkel text anges mellan öppningstagg och stängningstag 
                koda fram till 13:20

                tips - markera flera instanser av ngt via mulitmarkör - ctrl+d

                attribut att känna till
                förvalt värde - option selected
                värde som inte kan anges option disabled
                -->
                <option value="">-- Riksdagens olika partier, välj flera... --</option>
                <optgroup label="Tidöpartierna">
                    <option value="moderaterna.se">Moderaterna</option>
                    <option value="www.liberalerna.se">Liberalerna</option>
                    <option value="kristdemokraterna.se">Kristdemokraterna</option>
                    <option value="www.sd.se">Sverigedemokraterna</option>
                </optgroup>
                <optgroup label="Oppositionen">
                    <option value="www.socialdemokraterna.se">Socialdemokraterna</option>
                    <option value="www.centerpartiet.se">Centerpartierna</option>
                    <option value="www.vansterpartiet.se">Vänsterpartiet</option>
                    <option value="www.mp.se">Miljöpartiet</option>
                </optgroup>
            </select>
        </div>
        <div>
            <button type="submit">Mitt val</button>
        </div>

    </form>
