<!DOCTYPE html>

<html lang="sv">

<head>

    <meta charset="UTF-8">
    <title>Min hemsida</title>

</head>

<body>

    <header>

        Header..., ex en bild en slogan, en logga ...

    </header>

    <hr>


    <nav>

        <!-- länkar för att navigera mellan sidor -->

        <a href="index.html">Startsida</a> |
        <a href="about.html">Om att koda</a>

    </nav>


    <h1>Flisa</h1>

    <!-- elementet pre står för preformatted text -->
    <pre>


    Hallå världen

    Idag är det måndag ...        ... bästa dagen i veckan?

    
    </pre>

    <!-- ett stycke anges med elementet p (paragraf) -->
    <p>
        Imorgon är det torsdag
    </p>


    <p>
        <!-- elementet b skapar fet stil -->
        Allt är inte <b>guld</b> som glimmar
    </p>

    <p>

        <!-- elementet a (anchor) används för att skapa en länk 
        
        för att ange en adress finns attributet href
        för att ange ett mål (dvs browser specifikt) finns attributet target
        -->
        Läs mer om <a href="https://sv.wikipedia.org/wiki/Guld" target="_blank">guld</a>, eller kanske ngn annan metall.

    </p>

    <!-- elementet img används för att koda in / visa en bild
    
    elemetet img har flera olika attribut som bestämmer värden
    attributet src - ange källan, antingen absolut sökväg eller relativ sökväg
    attributet alt - beskriver med text vad som finns på bilden
    attributet width - bredd på bild, anges som ett numeriskt värde
    attributet height - höjd på bild, anges som ett numeriskt värde
    -->

    <!-- det finns flera olika typer av element, ex inline element och block element
    elementen <a>, <b>, <i>, <img> är alla exempel på inline element 
    -->

    <!-- man kan med fördel visa en bild och en bildtext med ett omslutande figure element 
    elementen <figure>, <figcaption>, <h1> är exempel på block element 
    -->




    <figure>
        <!-- bild med absolut referens/sökväg - inleds här med ett protokoll http.... -->
        <img src="https://www.mikaelsvensson.com/photo/wp-content/uploads/2019/09/190907631.jpg"
            alt="En solnedgång på Öland" width="300">

        <figcaption>
            <i>Det här kan vara ett resemål för mig en sommar. Foto: Mikael Svensson</i>
        </figcaption>

    </figure>



    <figure>
        <!-- bild med relativ referens/sökväg - inleds med en sökväg i ett mappsystem -->
        <img src="images/Oland-Ottenby-Vinter-MagnusRenmyr.webp"
            alt="Vinter på Öland, platt landskap med stuga - fyr på avstånd" width="300">

        <figcaption>
            <i>Vinter på Öland, foto: Magnus Renmyr</i>
        </figcaption>

    </figure>


    <!-- elementet footer - sidfot, kanske copyright -->

    <hr>

    <footer>

        &copy; Flisa

    </footer>

</body>

</html>
